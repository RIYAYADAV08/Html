<!-- hr tag
The <hr>(horizontal rule element) tag is used to add a horizontal line to separate content on the page.
It is a single tag. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hr tag</title>
</head>

<body>
    <p>This is my name which is RIYA YADAV.</p>
    <p>I am a Software Engineer.</p>
    <hr>
    <p>I am studying HTML.</p>
</body>

</html>
