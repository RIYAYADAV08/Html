<!-- Checkbox
A checkbox allows the user to select one or more options.-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox</title>
</head>

<body>
    <form action="/action">
        <div>
            <input type="checkbox" name="age" id="age">
            <label for="age">I am 18+</label>
        </div>
        <div>
            <input type="checkbox" name="age" id="age" checked> if pehle se hi ticked chahiye ho
            <label for="age">I am 18+</label>
        </div>
        <button>submit</button>
        <!--jaise hi checked karke submit karenge toh age = on url ayega aur agar unchecked karke submit karu toh url me kuch nhi ayega -->
    </form>
</body>

</html>
<!-- Checkbox mein name same ya different hone se selection par koi restriction nahi hoti. -->
