<!-- Semantic Markup
It is the markup that relates to the meaning of content.

Semantic and Non-Semantic Tag
Semantic Tags- Semantic tags are the html elements that clearly describe the meaning and purpose of their content.
Ex- <header>, <footer>, <nav>, <main>, <section>, <article>

Non-Semantic Tags- Non semantic tags are the html elements that do not clearly describes the meaning and purpose of their content.
Ex- <div>, <span>. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <title>Semantic Tags</title>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <nav>
            <a href="/home">Home</a>
            <a href="/about">About</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>About Us</h2>
            <p>This is about our website.</p>
        </section>
    </main>

    <article>
        <h2>HTML Learning</h2>
        <p>HTML is used to create web pages.</p>
    </article>

    <aside>
        <h3>Related Links</h3>
        <a href="/about">About Us</a>
    </aside>

    <footer>
        <p>All rights reserved.</p>
    </footer>

</body>

</html>
<!-- <header> - It defines the header content of a webpage.
<footer> - It defines the footer content of a webpage.
<nav> - It defines navigation links.
<section> - It defines a section of related content.
<article> - It defines independent, self-contained content.
<aside> - It defines content related to the main content, usually shown as side content.
<main> - It defines the main content of a webpage. -->
