<!-- HTML Entities- HTML entities are the special codes used to display reserved or special characters in an HTML page.
It begins with an ampersand(&) and end with a semicolon(;) -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<z>, initial-scale=1.0">
    <title>HTML Entities</title>
</head>

<body>
    <h1>a &lt; b</h1> <!-- < less than -->
    <p>apna &nbsp; college</p> <!--nbsp - non breaking space-->
    <p>apna &nbsp; &nbsp; college</p>
    <p>a &gt; b</p> <!-- >greater than -->
    <p>a &hearts; b</p>
    <p>a &quot; b</p>
    <p>a &amp; b</p> <!--  amp prints &-->
    <h1>The sky is cloudy &#9729; & it will rain &#9748; today. </h1>

</html>
