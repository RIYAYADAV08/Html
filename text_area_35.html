<!-- textarea- It is used to take multi line text input from the user. It is commonly used for comments, messages, and feedbacks etc. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>textarea</title>
</head>

<body>
    <form action="/action">
        <label for="feedback">Provide Feedback</label>
        <textarea id="feedback" name="feed"></textarea>
    </form>
</body>

</html>
