<!-- List
List are used to display a group of related items in an organized way.

Types of List
1.Unordered List- It is used to display a list of items without any specific order using the bullet points.
We can also change the style of bullet points.

2.Ordered List- It is used to display a group of related items in a specific order using numbers or letters.
We can also change the type in ordered list.

3.Description List- It is used to display a term and its description. 
4.Nested List- A list inside another list is called nested list.-->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>

<body>
    <ul>
        <li>Riya</li>
        <li>Hitesh</li>
        <li>Daksh</li>
    </ul>

    <ol>
        <li>Mahi</li>
        <li>Tannu</li>
        <li>Sonam</li>
    </ol>

    <ol type="a">
        <li>Mahi</li>
        <li>Tannu</li>
        <li>Sonam</li>
    </ol>
    <dl>
        <dt>HTML</dt>
        <dd>It is a language.</dd>
    </dl>

    <!-- Nested List -->
    <ul>
        <li>Fruites
            <ol type="I">
                <li>Mango</li>
                <li>Apple</li>
            </ol>
        </li>
    </ul>
</body>

</html>
