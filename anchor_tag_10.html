<!-- Anchor Tag
Anchor Tag is used to create an hyperlink to an HTML page, which allows users to navigate to another webpages, files or
locations.
href = Hypertext reference. It is an attribute.
Absolute url- It contains the complate url and is used to link to webpages on the Internet.
Relative url- Links only to files or pages within the same website. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Tag</title>
</head>

<body>
    <!-- Absilute url -->
    <a href="https://riyaportfolio-neon.vercel.app/">Portfolio</a>
    <!--Relative url -->
    <a href="intro_1.html">File</a>
</body>

</html>
