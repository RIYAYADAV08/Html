<!-- Action attribute
It is used to define what action need to be performed when a form is submitted or where the form data should be sent. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action attribute</title>
</head>

<body>
    <form action="/action"></form>
</body>

</html>
