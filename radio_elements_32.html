<!-- Radio element- Radio button is used when the user needs to select only one option from a group of options. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio</title>
</head>

<body>
    <form action="/action">
        <div>
            <input type="radio" name="fruit" id="apple" value="apple>
        <label for=" apple">apple</label>

            <input type="radio" name="fruit" id="mango" value="mango">
            <label for="mango">mango</label>

            <input type="radio" name="fruit" id="banana" value="banana">
            <label for="banana">banana</label>
        </div>
        <button>submit</button>
    </form>
</body>

</html>
<!-- name same hona chahiye agar tum chahte ho ki user sirf ek option select kare. 
name different honge,multiple options select kiye ja sakte hain. -->
