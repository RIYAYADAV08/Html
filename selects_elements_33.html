<!-- Select- It is used to create a dropdown list from which the user can select an option.  -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select</title>
</head>

<body>
    <form action="/action">
        <select name="profession" id="profession">
            <option value="stu">Student</option>
            <option value="dev">Developer</option>
        </select>
        <button>submit</button>
    </form>
</body>

</html>

<!-- agar mai chahti hu student pehle se hi selected hoke aye -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select</title>
</head>

<body>
    <form action="/action">
        <select>
            <option value="stu" selected>Student</option>
            <option value="dev ">Developer</option>
        </select>
        <button>submit</button>
    </form>
</body>

</html>
