<!-- Range-is used to create a slider that allows the user to select a value within a specified range. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range</title>
</head>
<body>
    <form action ="/action">
        <div>
            <label for="vol">Volume</label>
            <input type="range" id="vol" min="0" max="10" name="vol" step="10" value="30>  <!--agar hum chhate hai pehle se hi ek range select hoke aye toh value ke aage utna hi likh do-->
        </div>
        <button>Submit</button>
    </form>
</body>
</html>
