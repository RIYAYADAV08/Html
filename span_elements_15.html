<!-- SPAN in HTML 
Span is also a generic container used to hold other HTML elements or group elemeents together.
It is an Inline Element. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span</title>
</head>

<body>
    <span>
        <a href="https://www.Instagram.com">Instagram</a>
        <a href="https://www.Youtube.com">Youtube</a>
    </span>
    <a href="https://www.Chrome.com">Chrome</a>
</body>

</html>
