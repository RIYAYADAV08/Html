<!-- Table- It is used to display data in rows and columsn.
In table horizontal lines are rows, and vertical lines are columns.

<tr>-It is used to display table row.
    <th>- It isused to display table
    <td>- It is used to display table data. -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in HTML</title>
</head>

<body>
    <table border="black">
        <caption>Food Menu</caption>
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Frooti</td>
                <td>10</td>

            </tr>
            <tr>
                <td>Samosa</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Chips</td>
                <td>20</td>
            </tr>
        </tbody>

    </table>
</body>

</html>

<!-- Semantics In Table
<thead> - It is used to wrap the table header
<tbody> - It is used to wrap the table body
<tfoot> - It is used to wrap the table footer -->
