<!-- Placeholder Attribute
Placeholder attribute is used to show hints to the user inside the fields of input. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placeholder Attribute</title>
</head>

<body>
    <form action="/action">
        <input type="text" placeholder="Enter your username">
    </form>
</body>

</html>
