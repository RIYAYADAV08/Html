<!-- Inline Elements
Inline elements are those elements that takes only necessary width.
They do not start from the next line.
Ex- Anchor Tag and Image Tag.

Block Elements
Block elements are those elements that takes the full width available.
They always start from the next line.
Ex- Heading Element and Paragraph element. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block</title>
</head>

<body>
    <!-- Block -->
    <h1>Hello World</h1>
    <h1>Apna College</h1>
    <p>Hello World</p>
    <p>Apna College</p>
    <!-- Inline -->
    <a href="www.google.com">Google</a>
    <a href="www.facebook.com">Facebook</a>

</body>

</html>
