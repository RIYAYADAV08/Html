<!-- Button in HTML- It is used to create a clickable button on a webpage. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
</head>

<body>
    <button>hello</button> <!--form ke andar nhi h yeh toh yeh submit ka kaam nhi karega -->
    <form action="/action">
        <div>
            <label for="username">Username : </label>
            <input type="text" placeholder="enter username" id="username" />
        </div>

        <div>
            <label for="password">Password : </label>
            <input type="password" placeholder="enter password" id="password" />
        </div>

        <button>Submit</button>
        <button>hello</button>
        <!-- button ke andar humne agar kuch bhi likh diya form ke andar toh by dafault uska kaam submit karna hi hota hai -->

        <!--Button Attribute Types-->
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <!-- reset ka kaam form ke andar likhe huye sabhi data ko hata dena hota hai -->
        <button type="button">Hello</button> <!-- yeh sirf button hi h -->
        <br>
        <!-- BUTTON USING INPUT-->
        <input type="button">
        <!-- isse kuch hoga nhi submit karne ke liye submit likhna padega -->
        <input type="submit">
        <!-- submit ka kaam karega -->
        <input type="reset">
        <!-- reset ka kaam karega -->
        <input type="Submit" value="Click ME">
        <!-- submit ka kaam karega -->
        <input type="Reset" value="Reset">
        <!-- reset ka kaam karega -->
</body>

</html>
