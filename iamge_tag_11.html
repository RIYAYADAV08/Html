<!-- Image tag is used to create an image to a web page.
It is single tag.
Two attributes src and alt.
Src- It is used to specify the url of an image.
Alt- Alt is used to display alternative text to an image.
Sometimes an image can not be displayed due to an Internet Connection or the image file is missing. In such cases,
alternative text is displayed helping users undertsand what the image represents.
Absolute url- It contains the complete url and is used to link to webpages on the Internet.
Relative url- Links only to files or pages within the same website. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tag in HTML</title>
</head>

<body>
    <!-- Absolute url -->
    <img src="https://media.istockphoto.com/id/14394349/photo/red-apple-isolated-on-white-background-clipping-path-full-depth-of-field.jpg?s=612x612&w=0&k=20&c=Zi8kdlLPWQSd7IN_KcrlLRU9MpdQo7YKyGQpH90iQmg="
        alt="Apple">
    <!-- Relative url -->
    <img src="RIYA.jpeg" alt="I">
    <a href="https://www.google.com"><img src="image.jpg" alt="Google"> </a>
    <!--image tag to anchor ke andar bhi use kar sakte hai -->
</body>

</html>
